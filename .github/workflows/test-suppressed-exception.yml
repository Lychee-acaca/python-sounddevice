name: Test case for issue 586
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    strategy:
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Double-check Python version
        run: |
          python --version
      - name: Clone Git repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Python package
        run: |
          python -m pip install .
      - name: Run tests
        shell: cmd
        run: |
          python -c "import ctypes, sys; msvcrt = ctypes.cdll.msvcrt; h_stderr = msvcrt._get_osfhandle(2); print(f'Initial stderr handle: {h_stderr}'); import sounddevice; h_stderr_post = msvcrt._get_osfhandle(2); print(f'Post-import stderr handle: {h_stderr_post}');"
